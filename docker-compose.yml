services:
  postgres:
    image: postgres:16-alpine
    container_name: evenly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evenly
      POSTGRES_PASSWORD: evenly_dev_password
      POSTGRES_DB: evenly
    ports:
      - "5432:5432"
    volumes:
      - evenly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evenly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evenly_postgres_data:
