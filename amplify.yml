# AWS Amplify Hosting build settings.
#
# Deliberately minimal: Amplify detects Next.js and provisions SSR itself, so
# this file exists for one reason the default cannot cover. The Prisma Client
# is generated code that is not committed (prisma/schema.prisma is the source
# of truth, src/generated/prisma is build output), and roughly twenty modules
# import it. Without `prisma generate` the build fails at the first such
# import. The postinstall script in package.json covers this too; it is
# repeated here so the build does not depend on install hooks running.
#
# No `output: export` and no static settings: the app needs SSR for route
# handlers, server components and Auth.js.
#
# Migrations are deliberately NOT run here. See DEPLOYMENT.md for why and for
# the procedure to apply them.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `npm install`, not `npm ci`, and not by preference.
        #
        # The lockfile is generated on Windows and npm records only the
        # optional platform packages that apply to the machine that wrote it.
        # Three packages here pull in wasm fallbacks (@img/sharp-wasm32,
        # @napi-rs/wasm-runtime, @tailwindcss/oxide-wasm32-wasi) that depend on
        # @emnapi/core and @emnapi/runtime, and those two have no entry in the
        # lockfile at all, while @napi-rs/wasm-runtime, which requires them,
        # does. On Linux `npm ci` walks that dangling edge and refuses to
        # install.
        #
        # This is not fixable from here: `npm install --package-lock-only`,
        # with and without --os=linux --cpu=x64, still prunes both packages,
        # because npm will not record dependencies of an optional package it
        # cannot install locally. `npm install` resolves the tree against the
        # registry at build time instead of trusting a lockfile written for
        # another platform, so the Linux binaries it needs are found.
        #
        # What this costs: npm may resolve a dependency to a newer version
        # than the lockfile pins, so builds are no longer bit-for-bit
        # reproducible. Ranges in package.json are the only thing constraining
        # them. Committing a lockfile generated on Linux (in CI, or a
        # container) would allow `npm ci` to come back; see DEPLOYMENT.md.
        - npm install --no-audit --no-fund
    build:
      commands:
        - npx prisma generate
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
      # Excluded, not merely large: this is Turbopack's incremental build
      # cache, restored here from `cache.paths` below before the build runs
      # and left on disk afterward. It speeds up the next build and is never
      # read at runtime, so shipping it only inflates the deployment package,
      # and it does so unpredictably: its size grows with accumulated
      # incremental state, which is what pushed one build over Amplify's
      # 230MB artifact limit while a fresh build might not have. Paths here
      # are relative to baseDirectory, so this is `.next/cache`.
      - "!cache/**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
